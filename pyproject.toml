[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photocopier-cli"
dynamic = ["version"]
description = "Back up photos and videos to external drives — organised by date, de-duplicated, and verified."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Murrell", email = "dsmurrell@gmail.com" }]
requires-python = ">=3.10"
keywords = ["photos", "backup", "organize", "deduplicate", "exif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/dsmurrell/photocopier"
Repository = "https://github.com/dsmurrell/photocopier"
# Documentation = "https://photocopier.dev"  # uncomment when the docs site is live

[project.scripts]
photocopier = "photocopier.cli:main"

[tool.hatch.version]
path = "photocopier/__init__.py"

# The package is named photocopier-cli, but the code folder is photocopier
[tool.hatch.build.targets.wheel]
packages = ["photocopier"]

# Source package: just the code, tests and docs (not plans or personal scripts)
[tool.hatch.build.targets.sdist]
include = ["photocopier", "tests", "README.md", "LICENSE", "pyproject.toml"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "twine>=7.0"]  # twine 7 accepts Metadata-Version 2.5 (current hatchling)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
